# ── Datasource — H2 in-memory ─────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── JWT — use local fallback, no Secrets Manager ──────────────────────────────
auth.jwt.secret-name=
auth.jwt.secret=test-secret-for-testing-must-be-at-least-32-chars

# ── Dev bypass — enabled so tests can obtain a token via /auth/dev-login ──────
auth.dev.bypass.enabled=true
auth.dev.bypass.user=dev@test.com

# ── DynamoDB — mocked in tests, endpoint left blank ───────────────────────────
aws.dynamodb.endpoint=
aws.region=us-east-1

# ── Actuator — same port in tests (no separate management port) ───────────────
management.server.port=
management.endpoints.web.exposure.include=health
