spring.application.name=dsp-demo-project
server.port=8080

# RDS — injected by ECS task definition from Terraform
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Hibernate — creates/updates schema on startup
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Actuator on dedicated port
management.server.port=8081
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# DynamoDB — no endpoint override in prod, SDK uses real AWS
aws.dynamodb.endpoint=

# Auth
auth.dev.bypass.enabled=false
auth.jwt.secret-name=${AUTH_JWT_SECRET_NAME}
